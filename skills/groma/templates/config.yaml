# groma project configuration (.groma/config.yaml)
# Commit this file. Edit it by hand or re-run /groma; groma validates it on every run.
# Reference: https://github.com/Zeotyn/groma#configuration

schema: 1                         # config schema version, do not edit
initialized_with: groma@{{version}}  # suite version of the last /groma run

project:
  name: {{project_name}}
  has_ui: {{has_ui}}              # true | false, controls the design skill question

project_type: {{project_type}}    # greenfield | brownfield, detected
project_type_override: none       # none | greenfield | brownfield

methodology: {{methodology}}      # openspec | spec-kit | bmad | gsd | none
workflow: {{workflow}}            # workflow layer from the catalog, or none

agents: [{{agents}}]              # any of: claude, copilot, gemini, cursor, codex

# One entry per catalog category. Single-select: one id. Multi-select: a list.
skills:
  design: {{skills_design}}
  writing: [{{skills_writing}}]
  pragmatism: {{skills_pragmatism}}
  diagrams: {{skills_diagrams}}
  discovery: {{skills_discovery}}

docs:
  review_after_days: 90           # default for new docs
  optional: []                    # any of: constraints, quality, security, operations, stakeholders
  gate: review                    # off | remind | review | strict, see "Living docs" in the README
  adr_from: design-alternatives   # design-alternatives | marked | off

conventions:
  changes:
    enabled: true
    digits: 3
    types:
      m: milestone
      c: change
      f: fix
      s: spike
      r: refactor
      d: docs

# Review loop for propose and apply (skill groma-loop).
review:
  mode: autonomous                # autonomous | gated (approval after propose and before archive)
  stop_when: no-high              # no-high | no-findings
  propose:
    reviewer: auto                # auto | self | <agent>[:<model>], agents: claude, copilot, gemini, codex
    max_rounds: 2
  apply:
    reviewer: auto
    per: task-group               # task | task-group | change
    max_rounds: 1
    test_retries: 2

# Lifecycle reminders (groma-methodology status.sh)
reminders:
  archive_when_done: true
  stale_change_days: 14           # 0 disables
  untested_tasks: true
  uncommitted: true
  unpushed: true
# Next action (groma-methodology next.sh). Claude Code hooks give it to the agent at session
# start and show it after an answer. hook is unset (auto): the hooks follow your global flag
# file ~/.claude/.groma-next-always. Add "hook: on" or "hook: off" to decide for this project.
next:
  reshow_minutes: 30              # show the same suggestion again after this many minutes, 0 = only when it changes

# Git workflow (skills groma-loop and groma-agents). groma-agents renders the "Git workflow"
# section of AGENTS.md from these keys when it creates that file. After editing them, update
# the section yourself, or re-run /groma: it puts the rendered section into the findings
# report as a snippet and never edits an existing AGENTS.md.
git:
  integrate: rebase               # rebase | merge | squash, how a change branch reaches the main branch
  branch_per_change: true         # true | false, groma-loop works on a branch named after the change
  commits: conventional           # conventional | free
  push: ask                       # ask | auto | never, push of the main branch after integration

# Progress of the last run, used to resume. Values: done | pending | skipped
steps:
  detect: pending
  interview: pending
  config: pending
  methodology: pending
  skills: pending
  docs: pending
  agents: pending
  summary: pending
