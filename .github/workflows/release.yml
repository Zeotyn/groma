name: release

# Publishes groma-cli to npm when a tag v<version> is pushed (change C008).
# npm trusted publishing: npmjs.com trusts Zeotyn/groma + this file name
# (release.yml); the job proves its identity through OIDC (id-token: write).
# No npm token is used or needed. Renaming this file stops publishing.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
      id-token: write   # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches every version and the CHANGELOG
        run: sh scripts/release-check.sh "$GITHUB_REF_NAME"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5.1 or newer)
        run: npm install -g npm@11 && npm --version
      - name: Install pinned shellcheck
        env:
          SC_VERSION: v0.10.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SC_VERSION/shellcheck-$SC_VERSION.linux.x86_64.tar.xz" | tar -xJ
          sudo install "shellcheck-$SC_VERSION/shellcheck" /usr/local/bin/shellcheck
      - name: Install CLI dependencies
        run: npm ci
      - name: Levels 1-3
        run: scripts/test.sh
      - name: Publish to npm
        run: npm publish --provenance --access public
      - name: GitHub release with the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/release-check.sh --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
