name: evals

# Level 4: headless agent evals. They cost API tokens, so they run nightly,
# on demand, and on pull requests labeled "eval".
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  evals:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'eval')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Install Claude Code and OpenSpec
        run: npm install -g @anthropic-ai/claude-code @fission-ai/openspec@1.16.0
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROMA_EVAL_BUDGET: "3"
          GROMA_EVAL_DIR: ${{ runner.temp }}/groma-evals
        run: scripts/test.sh evals
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-logs
          path: ${{ runner.temp }}/groma-evals/*.log
