name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned shellcheck
        env:
          SC_VERSION: v0.10.0
        run: |
          case "$RUNNER_OS" in
            Linux) arch=linux.x86_64 ;;
            macOS) arch=darwin.aarch64 ;;
          esac
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$SC_VERSION/shellcheck-$SC_VERSION.$arch.tar.xz" | tar -xJ
          sudo install "shellcheck-$SC_VERSION/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Levels 1-3
        run: scripts/test.sh
